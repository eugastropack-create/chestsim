    <script>
      function syncNavLang(overrideLang) {
        const lang = overrideLang || localStorage.getItem('lol_game_lang') || 'en';
        const isTr = lang === 'tr';
        const hHome = document.getElementById('idx-nav-home');
        const hBlog = document.getElementById('idx-nav-blog');
        const hAbout = document.getElementById('idx-nav-about');
        const mHome = document.getElementById('idx-m-nav-home');
        const mBlog = document.getElementById('idx-m-nav-blog');
        const mAbout = document.getElementById('idx-m-nav-about');
        const seoTitle = document.getElementById('idx-seo-title');
        const seoDesc = document.getElementById('idx-seo-desc');

        if (hHome) hHome.textContent = isTr ? 'Ana Sayfa' : 'Home';
        if (hBlog) hBlog.textContent = isTr ? 'Blog & Rehber' : 'Blog & Guides';
        if (hAbout) hAbout.textContent = isTr ? 'Hakkımızda' : 'About Us';
        if (mHome) mHome.textContent = isTr ? '🏠 Ana Sayfa' : '🏠 Home';
        if (mBlog) mBlog.textContent = isTr ? '📖 Blog & Rehber' : '📖 Blog & Guides';
        if (mAbout) mAbout.textContent = isTr ? 'ℹ️ Hakkımızda' : 'ℹ️ About Us';

        if (seoTitle) {
          seoTitle.textContent = isTr ? 'LoL Hextech Clicker Simülasyonu Hakkında' : 'About LoL Hextech Clicker Simulator';
        }
        if (seoDesc) {
          seoDesc.textContent = isTr
            ? "LoL Hextech Clicker, League of Legends oyuncuları için tasarlanmış bağımsız bir simülatördür. Vadi'nin en güçlü canavarı Baron Nashor'a karşı Master Yi'nin Alpha Strike yeteneğini kullanarak hasar verin, XP kazanın ve anahtar toplayın. Topladığınız anahtarlarla Hextech Sandıkları açarak kostüm düşme oranlarını test edebilirsiniz. Bu tamamen risksiz, eğlence amaçlı bir simülasyondur ve Riot Games ile resmi bir bağı yoktur."
            : "LoL Hextech Clicker is an independent simulator designed for League of Legends enthusiasts. Battle against Baron Nashor using Master Yi's Alpha Strike ability to deal DPS, earn XP, and collect keys. Use your keys to open Hextech Chests and test authentic skin drop rates. This is a 100% free, risk-free simulation with no official affiliation with Riot Games.";
        }
      }
      syncNavLang();
      window.addEventListener('storage', function() { syncNavLang(); });
      window.addEventListener('lol_lang_changed', function(e) { syncNavLang(e.detail); });
    </script>

    <script>
      function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const burger = document.getElementById('hamburger-icon');
        const close = document.getElementById('close-icon');
        if (menu.classList.contains('hidden')) {
          menu.classList.remove('hidden');
          burger.classList.add('hidden');
          close.classList.remove('hidden');
        } else {
          menu.classList.add('hidden');
          burger.classList.remove('hidden');
          close.classList.add('hidden');
        }
      }
    </script>
